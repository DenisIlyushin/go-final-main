name: Go CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
golang-linter:
  name: Linter
  runs-on: ubuntu-22.04
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: '1.23.4'
        cache: true

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v4
      with:
        version: v1.59.1
        skip-cache: true

  test:
    name: Unit Tests
    runs-on: ubuntu-22.04
    container: golang:1.23.4
    steps:
      - uses: actions/checkout@v4
      - name: Run go vet
        run: go vet ./...
      - name: Run unit tests
        run: GOOS=linux GOARCH=amd64 go test -v ./...

  coverage:
    name: Coverage Report
    runs-on: ubuntu-22.04
    needs: [golang-linter, test]
    container: golang:1.23.4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Generate coverage
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: vadskev/final-sprint-12

  deploy:
    name: Deploy to Docker Hub
    runs-on: ubuntu-22.04
    needs: coverage
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }} # тут токен, следы путаю

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/go-sprint-12
          tags: type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}